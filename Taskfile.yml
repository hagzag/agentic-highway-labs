# https://taskfile.dev
version: "3"

vars:
  P1: ./practice/part1/run.sh
  P2: ./practice/part2/run.sh
  P3: ./practice/part3/run.sh
  P4: ./practice/part4/run.sh
  P5: ./practice/part5/run.sh
  P6: ./practice/part6/run.sh
  P7: ./practice/part7/run.sh
  P8: ./practice/part8/run.sh

tasks:
  default:
    cmds: [task --list]

  # --- Part 1: The Safe Highway (Linkerd mTLS) ------------------------------
  part1:up:      {desc: "k3d cluster + agents, no mesh", cmds: ["{{.P1}} up"]}
  part1:sniff:   {desc: "tcpdump Redis while the planner queues a plan", cmds: ["{{.P1}} sniff"]}
  part1:mesh:    {desc: "install Linkerd and inject every pod", cmds: ["{{.P1}} mesh"]}
  part1:edges:   {desc: "linkerd viz edges: who talks to whom, with which identity", cmds: ["{{.P1}} edges"]}
  part1:inject:  {desc: "poison the inventory; the authenticated executor deletes prod-archive", cmds: ["{{.P1}} inject"]}
  part1:key:     {desc: "show the static LLM key every agent carries", cmds: ["{{.P1}} key"]}
  part1:all:     {desc: "run Part 1 end to end", cmds: ["{{.P1}} all"]}
  part1:capture: {desc: "run Part 1 and save output to practice/part1/captured/k3d", cmds: ["{{.P1}} capture"]}
  part1:cleanup: {desc: "delete the migration namespace", cmds: ["./practice/part1/cleanup.sh"]}

  # --- Part 2: License Plates (SPIRE + JWS-signed payloads) -----------------
  part2:up:         {desc: "Part 1 road + SPIRE + registration entries", cmds: ["{{.P2}} up"]}
  part2:svid:       {desc: "each workload asks SPIRE who it is", cmds: ["{{.P2}} svid"]}
  part2:forge-open: {desc: "BREAK: rogue pod queues a task, executor obeys", cmds: ["{{.P2}} forge-open"]}
  part2:sign:       {desc: "FIX: sign with X.509-SVID, verify against the SPIRE bundle", cmds: ["{{.P2}} sign"]}
  part2:forge:      {desc: "rogue: unsigned + self-signed attempts are rejected", cmds: ["{{.P2}} forge"]}
  part2:tamper:     {desc: "rogue rewrites signed tasks in the queue; rejected", cmds: ["{{.P2}} tamper"]}
  part2:poison:     {desc: "BREAK AGAIN: a validly signed bad instruction still runs", cmds: ["{{.P2}} poison"]}
  part2:all:        {desc: "run Part 2 end to end", cmds: ["{{.P2}} all"]}
  part2:capture:    {desc: "run Part 2 and save output to practice/part2/captured/k3d", cmds: ["{{.P2}} capture"]}
  part2:doctor:     {desc: "SPIRE diagnostics: nodes, attested agents, entries, attestation log", cmds: ["{{.P2}} doctor"]}
  part2:cleanup:    {desc: "delete SPIRE and the migration namespace", cmds: ["./practice/part2/cleanup.sh"]}

  # --- Part 3: Driving Permits (delegation, OPA at the MCP gateway, LLM gateway) ---
  part3:up:      {desc: "Part 2 road + Keycloak + STS + MCP gateway (OPA) + LLM gateway", cmds: ["{{.P3}} up"]}
  part3:key:     {desc: "BREAK: every agent pod carries the static LLM key", cmds: ["{{.P3}} key"]}
  part3:llm-gw:  {desc: "FIX: key lives only in llm-gateway; agents present a JWT-SVID", cmds: ["{{.P3}} llm-gw"]}
  part3:login:   {desc: "a human logs in to Keycloak (LAB_USER, default tester)", cmds: ["{{.P3}} login"]}
  part3:permit:  {desc: "FIX: token exchange per hop (sub + act, scope, TTL); gateway checks every call", cmds: ["{{.P3}} permit"]}
  part3:poison:  {desc: "Part 2's ending replayed: the signed delete is DENIED at the gateway", cmds: ["{{.P3}} poison"]}
  part3:admin:   {desc: "ops-admin holds delete; the retention lock still DENIES", cmds: ["{{.P3}} admin"]}
  part3:steal:   {desc: "rogue lifts a permit from the queue; useless without the actor's SVID", cmds: ["{{.P3}} steal"]}
  part3:bypass:  {desc: "BREAK AGAIN: rogue skips the gateway and calls mcp-tools directly", cmds: ["{{.P3}} bypass"]}
  part3:all:     {desc: "run Part 3 end to end", cmds: ["{{.P3}} all"]}
  part3:capture: {desc: "run Part 3 and save output to practice/part3/captured/k3d", cmds: ["{{.P3}} capture"]}
  part3:doctor:  {desc: "Part 3 diagnostics: pods, SPIRE entries, Keycloak login, OPA policy", cmds: ["{{.P3}} doctor"]}
  part3:policy-test: {desc: "opa test the gateway policy (needs the opa CLI)", cmds: ["opa test -v practice/part3/policy"]}
  part3:cleanup: {desc: "delete Keycloak, SPIRE and the migration namespace", cmds: ["./practice/part3/cleanup.sh"]}

  # --- Part 4: The Closed Track (sandbox + egress fence + blast-radius report) ---
  part4:up:          {desc: "Part 3 road + sink (internet) + sandbox-runner (run_script), no fence", cmds: ["{{.P4}} up"]}
  part4:probe-before: {desc: "blast-radius matrix before the fence", cmds: ["{{.P4}} probe-before"]}
  part4:break:       {desc: "BREAK: bypass still works; poisoned run_script steals the SA token to the sink", cmds: ["{{.P4}} break"]}
  part4:gvisor:      {desc: "best-effort gVisor (runsc) install on the k3d node", cmds: ["{{.P4}} gvisor"]}
  part4:fence:       {desc: "FENCE: NetworkPolicy + no SA token + gVisor runtime", cmds: ["{{.P4}} fence"]}
  part4:verify:      {desc: "the bypass is dead and the exfil finds nothing to steal or send", cmds: ["{{.P4}} verify"]}
  part4:probe-after: {desc: "blast-radius matrix after the fence", cmds: ["{{.P4}} probe-after"]}
  part4:all:         {desc: "run Part 4 end to end", cmds: ["{{.P4}} all"]}
  part4:capture:     {desc: "run Part 4 and save output to practice/part4/captured/k3d", cmds: ["{{.P4}} capture"]}
  part4:doctor:      {desc: "Part 4 diagnostics: pods, netpol, runtime, runner/sink logs", cmds: ["{{.P4}} doctor"]}
  part4:cleanup:     {desc: "delete the internet ns, sandbox-runner, netpol, then Part 3", cmds: ["./practice/part4/cleanup.sh"]}

  # --- Part 5: The Black Box (signed, hash-chained, anchored audit trail) ---
  part5:up:      {desc: "Part 4 road (fence off) + audit collector (PVC tape, signed checkpoints)", cmds: ["{{.P5}} up"]}
  part5:break:   {desc: "BREAK: the crash with pod logs only; nobody can say who, and the evidence dies", cmds: ["{{.P5}} break"]}
  part5:record:  {desc: "FIX: every hop signs what it saw into the black box; same crash again", cmds: ["{{.P5}} record"]}
  part5:replay:  {desc: "replay from the sink's src IP and from the deleted bucket: human, agent, task", cmds: ["{{.P5}} replay"]}
  part5:forge:   {desc: "rogue plants a fake gateway ALLOW (unsigned, self-signed); rejected", cmds: ["{{.P5}} forge"]}
  part5:tamper:  {desc: "insider rewrites a record and rechains; signature + checkpoint catch it", cmds: ["{{.P5}} tamper"]}
  part5:verify:  {desc: "verify the tape against the latest anchored checkpoint", cmds: ["{{.P5}} verify"]}
  part5:blind:   {desc: "collector down: the gateway refuses what it can't record", cmds: ["{{.P5}} blind"]}
  part5:all:     {desc: "run Part 5 end to end", cmds: ["{{.P5}} all"]}
  part5:capture: {desc: "run Part 5 and save output to practice/part5/captured/k3d", cmds: ["{{.P5}} capture"]}
  part5:doctor:  {desc: "Part 5 diagnostics: recorder env, tape, checkpoint, rejections, drops", cmds: ["{{.P5}} doctor"]}
  part5:cleanup: {desc: "delete the collector, tape and checkpoints, then Part 4", cmds: ["./practice/part5/cleanup.sh"]}

  # --- Utilities ------------------------------------------------------------
  image:  {desc: "build highway-agent:dev and import into k3d", cmds: ["bash -c 'source scripts/lib.sh && image_build'"]}
  down:   {desc: "delete the k3d cluster", cmds: ["k3d cluster delete {{.CLUSTER | default \"highway\"}}"]}
  smoke:
    desc: "maintainers: run the agents as local processes (no cluster), mock LLM"
    cmds: ["scripts/local-smoke.sh start", "echo 'running; stop with: scripts/local-smoke.sh stop'"]

  # --- Part 6: The Paved Track (credential-injecting egress gateway, permits + audit at egress) ---
  part6:up:      {desc: "Parts 1-5 + store API + egress gateway (holds the credential) + paved NetworkPolicy", cmds: ["{{.P6}} up"]}
  part6:paved:   {desc: "Part 4's exfil finds no token; the store credential isn't in the sandbox either", cmds: ["{{.P6}} paved"]}
  part6:break:   {desc: "BREAK: the poisoned script asks the egress gateway; the credential is injected; prod-archive deleted", cmds: ["{{.P6}} break"]}
  part6:permits: {desc: "FIX: the egress gateway checks the permit (OPA) and records it before injecting", cmds: ["{{.P6}} permits"]}
  part6:replay:  {desc: "replay from the bucket: the credential spent on behalf of nobody, then the DENY", cmds: ["{{.P6}} replay"]}
  part6:all:     {desc: "run Part 6 end to end", cmds: ["{{.P6}} all"]}
  part6:local:   {desc: "run Part 6 as local processes (no cluster) and capture to practice/part6/captured/local", cmds: ["./practice/part6/local.sh"]}
  part6:capture: {desc: "run Part 6 and save output to practice/part6/captured/k3d", cmds: ["{{.P6}} capture"]}
  part6:doctor:  {desc: "Part 6 diagnostics: pods, netpol, egress gateway env and decisions", cmds: ["{{.P6}} doctor"]}
  part6:cleanup: {desc: "delete the egress gateway, store credential and policy, then Part 5", cmds: ["./practice/part6/cleanup.sh"]}

  # --- Part 7: Agent Substrate (kind on Linux; not yet captured) ------------
  part7:up:      {desc: "kind + Agent Substrate + store + lab STS + store-gate + the runner as a gVisor actor", cmds: ["{{.P7}} up"]}
  part7:paved:   {desc: "no EgressPolicy: Part 4's exfil from inside an actor", cmds: ["{{.P7}} paved"]}
  part7:break:   {desc: "BREAK: credentialUri injection; the cleanup script deletes prod-archive through Substrate", cmds: ["{{.P7}} break"]}
  part7:fix:     {desc: "FIX: actorJwt to store-gate; the permit check denies the delete", cmds: ["{{.P7}} fix"]}
  part7:all:     {desc: "run Part 7 end to end", cmds: ["{{.P7}} all"]}
  part7:capture: {desc: "run Part 7 and save output to practice/part7/captured/kind", cmds: ["{{.P7}} capture"]}
  part7:doctor:  {desc: "Part 7 diagnostics: Substrate pods, actor, egress policy, denials", cmds: ["{{.P7}} doctor"]}
  part7:down:    {desc: "delete the kind cluster", cmds: ["{{.P7}} down"]}
  part7:vm-shell: {desc: "macOS: open a shell in Part 7's Lima VM (creates it if needed)", cmds: ["{{.P7}} vm-shell"]}
  part7:vm-down:  {desc: "macOS: delete Part 7's Lima VM", cmds: ["{{.P7}} vm-down"]}

  # --- Part 8: OpenShell (Docker, runs on macOS; not yet captured) ----------
  part8:up:      {desc: "OpenShell CLI + store, lab STS, store-gate, OPA containers + the store provider", cmds: ["{{.P8}} up"]}
  part8:paved:   {desc: "Part 4's exfil in an OpenShell sandbox: placeholder only, no route out", cmds: ["{{.P8}} paved"]}
  part8:break:   {desc: "BREAK: provider injects the store token; the cleanup script deletes prod-archive", cmds: ["{{.P8}} break"]}
  part8:l7:      {desc: "FIX A: OpenShell L7 rules deny DELETE prod-archive (static, per sandbox)", cmds: ["{{.P8}} l7"]}
  part8:prove:   {desc: "openshell-prover: candidate policies vs a read-only boundary", cmds: ["{{.P8}} prove"]}
  part8:gate:    {desc: "FIX B: sandbox reaches only store-gate; the permit check denies the delete", cmds: ["{{.P8}} gate"]}
  part8:all:     {desc: "run Part 8 end to end", cmds: ["{{.P8}} all"]}
  part8:capture: {desc: "run Part 8 and save output to practice/part8/captured/docker", cmds: ["{{.P8}} capture"]}
  part8:down:    {desc: "delete the sandbox, containers and network", cmds: ["{{.P8}} down"]}
