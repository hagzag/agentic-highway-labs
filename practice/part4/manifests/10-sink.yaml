# "The internet": a namespace with no mesh and no business talking to migration.
# If a migration pod can POST here, egress is too open. The fence makes it unreachable.
apiVersion: v1
kind: Namespace
metadata:
  name: internet
  labels: {app.kubernetes.io/part-of: agentic-highway}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sink, namespace: internet}
spec:
  replicas: 1
  selector: {matchLabels: {app: sink}}
  template:
    metadata: {labels: {app: sink}}
    spec:
      containers:
        - name: sink
          image: highway-agent:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "highway.sink"]
          ports: [{containerPort: 9000, name: http}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: sink, namespace: internet}
spec:
  selector: {app: sink}
  ports: [{port: 9000, targetPort: http, name: http}]
